[package]
name = "polyx-launchpad"
version = "0.1.0"
description = "Polyx bonding-curve launchpad — original implementation of a constant-product token launch with graduation to an on-chain AMM."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "polyx_launchpad"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["token_2022_extensions"] }
